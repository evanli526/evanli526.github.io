<article class="entry"><div class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><a class="tag" href="{{ .Section | relURL }}/">{{ if eq .Section "notes" }}笔记{{ else }}日志{{ end }}</a></div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify) }}</p><div class="entry-bottom">{{ with .GetTerms "categories" }}<div class="entry-categories" aria-label="文章分类">{{ range . }}<a class="category-link" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div>{{ end }}<a class="read" href="{{ .RelPermalink }}">阅读全文 ↗</a></div></article>
