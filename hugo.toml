baseURL = 'https://evanli526.github.io/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh'
title = 'senyang'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
summaryLength = 80
[params]
  description = 'senyang 个人博客'
[permalinks]
  notes = '/notes/:slug/'
  journal = '/journal/:slug/'
[markup]
  [markup.highlight]
    noClasses = false
    style = 'monokai'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\[', '\]']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.goldmark.renderer]
    unsafe = false
[caches.images]
  dir = ':cacheDir/images'

[taxonomies]
  category = "categories"
